<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua and Rona's Bucket List</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #ffe6f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin: 30px 0;
        }

        header h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3em;
            color: #ff3399;
        }

        .photos {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            gap: 20px;
            position: relative;
        }

        .photos img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff66b3;
        }

        .heart {
            font-size: 3em;
            color: red;
            position: absolute;
            top: 40px;
        }

        .bucket-list {
            background: #fff0f6;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }

        .bucket-list h2 {
            text-align: center;
            color: #ff3399;
            margin-bottom: 20px;
            font-family: 'Pacifico', cursive;
        }

        .bucket-list ul {
            list-style: none;
            padding: 0;
        }

        .bucket-list li {
            background: #ffb3d9;
            margin: 10px 0;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bucket-list li:hover {
            transform: scale(1.05);
            background: #ff80c1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Joshua & Rona's Bucket List</h1>
    </header>

    <div class="photos">
        <img src="your-photo.jpg" alt="Joshua">
        <span class="heart">❤️</span>
        <img src="gf-photo.jpg" alt="Rona">
    </div>

    <div class="bucket-list">
        <h2>Our Adventures</h2>
        <ul>
            <li>Intramuros</li>
            <li>Baguio</li>
            <li>Tagaytay</li>
            <li>National Museum</li>
            <li>BGC</li>
        </ul>
    </div>

</body>
</html>
